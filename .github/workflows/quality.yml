name: Backend quality
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --locked --group deploy
      - run: npm ci
      - run: uv run ruff check src tests migrations scripts
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run python scripts/generate_frontend_contract.py --check
      - run: uv run python scripts/setup_payment_demo.py
      - run: npm run deploy:check
      - run: docker compose --env-file .env.payments -f compose.payments.yml up -d --wait
      - name: Start local Worker and queue emulator
        run: |
          setsid uv run --group deploy python scripts/dev_workers.py > worker.log 2>&1 &
          echo $! > worker.pid
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18090/health; then exit 0; fi
            sleep 2
          done
          cat worker.log
          exit 1
      - run: uv run python scripts/payment_smoke.py
      - run: curl -fsS 'http://127.0.0.1:18090/cdn-cgi/handler/scheduled?cron=*/10%20*%20*%20*%20*'
      - if: failure()
        run: cat worker.log
      - name: Stop local Worker before dependency cache cleanup
        if: always()
        run: |
          if [ -f worker.pid ]; then
            kill -- "-$(cat worker.pid)" 2>/dev/null || true
          fi
      - if: always()
        run: docker compose --env-file .env.payments -f compose.payments.yml down
