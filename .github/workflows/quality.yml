name: Backend quality
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.17'
      - run: uv sync --locked
      - run: uv run ruff check src tests migrations scripts
      - run: uv run pytest
      - run: uv run python scripts/generate_frontend_contract.py --check
      - run: uv run python scripts/setup_payment_demo.py
      - run: docker compose --env-file .env.payments -f compose.payments.yml up -d --build --wait
      - run: uv run python scripts/payment_smoke.py
      - if: always()
        run: docker compose --env-file .env.payments -f compose.payments.yml down
