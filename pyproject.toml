[project]
name = "wellnest-backend"
version = "0.2.0"
description = "A resumable wellness assessment with server-owned results and access control"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "asyncpg>=0.30,<1",
    "httpx>=0.28,<1",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-asyncpg>=0.65b0",
    "sqlalchemy>=2.0,<3",
]

[dependency-groups]
deploy = ["workers-py", "workers-runtime-sdk"]
dev = [
    "uvicorn>=0.34",
    "httpx>=0.28",
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.11",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.15",
    "psycopg[binary]>=3.2",
    "testcontainers[postgres]>=4.10",
    "pyright>=1.1.414",
    "asyncpg-stubs>=0.31.3",
]
migrations = [
    "alembic>=1.15",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]


[tool.pyright]
include = ["src/app/database.py", "src/app/repositories", "src/app/services", "src/app/composition.py", "src/app/dependencies"]
extraPaths = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
