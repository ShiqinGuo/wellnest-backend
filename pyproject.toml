[project]
name = "wellnest-backend"
version = "0.2.0"
description = "A resumable wellness assessment with server-owned results and access control"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "asyncpg>=0.30,<1",
    "celery>=5.6,<6",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["uvicorn>=0.34", "httpx>=0.28", "pytest>=8", "pytest-asyncio>=1", "ruff>=0.11", "sqlalchemy>=2.0,<3", "alembic>=1.15", "psycopg[binary]>=3.2", "testcontainers[postgres]>=4.10"]
migrations = [
    "alembic>=1.15",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

